<div class="h-full flex gap-6 pt-6">
  <section class="bg-orange-100 w-1/3 rounded-lg p-6 flex flex-col">
    <h2 class="text-center text-2xl mb-6">Nuevas</h2>
    <order-list>
      @for (props of newOrders(); track props.order.id) {
        <li>
          <order-card
            [order]="props.order"
            [isProcessing]="props.isProcessing"
            (accept)="acceptOrder($event)"
            (cancel)="acceptOrder($event)"
          />
        </li>
      }
    </order-list>
  </section>

  <section class="bg-amber-100 w-1/3 rounded-lg p-6 flex flex-col">
    <h2 class="text-center text-2xl mb-6">Aceptadas</h2>
    <order-list>
      @for (props of acceptedOrders(); track props.order.id) {
        <li>
          <order-card
            [order]="props.order"
            [isProcessing]="props.isProcessing"
            (readyForPickup)="markAsReadyForPickup($event)"
          />
        </li>
      }
    </order-list>
  </section>

  <section class="bg-purple-100 w-1/3 rounded-lg p-6 flex flex-col">
    <h2 class="text-center text-2xl mb-6">Finalizadas</h2>
    <order-list>
      @for (props of readyOrders(); track props.order.id) {
        <li>
          <order-card [order]="props.order" />
        </li>
      }
    </order-list>
  </section>
</div>
