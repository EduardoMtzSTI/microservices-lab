<li class="bg-blue-300/50 p-4 rounded-lg w-full max-w-md space-y-2 shadow-lg">
  <h1 class="text-xl">{{ product().name }}</h1>
  <hr />
  <p>{{ product().description }}</p>
  <p>{{ product().price }}/{{ product().currency }}</p>
  <div class="flex justify-end">
    <button mat-flat-button (click)="onClickAdd()">Agregar</button>
  </div>
</li>
