spring.application.name=payment-service
server.port=8084

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/food-delivery}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.format_sql=true

# Kafka - connexion
spring.kafka.bootstrap-servers=localhost:9092

# Kafka - consumer
spring.kafka.consumer.group-id=payment-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Kafka - producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# Kafka - topics
app.kafka.topic.payment-confirmed=payment.confirmed
app.kafka.topic.payment-failed=payment.failed

# Outbox
app.outbox.relay-interval-ms=2000
